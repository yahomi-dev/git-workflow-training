<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ひだまり図書室</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <img class="site-logo" src="img/logo.svg" alt="ひだまり図書室のロゴ" width="48" height="48">
      <h1>ひだまり図書室</h1>
      <p class="tagline">まちの小さな図書室。だれでも、いつでも。</p>
    </header>

    <main>
      <section id="hours" class="hours">
        <h2>開館時間</h2>
        <table class="hours-table">
          <thead>
            <tr>
              <th scope="col">曜日</th>
              <th scope="col">時間</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>月曜</td>
              <td>休館</td>
            </tr>
            <tr>
              <td>火曜〜金曜</td>
              <td>10:00〜19:00</td>
            </tr>
            <tr>
              <td>土曜</td>
              <td>10:00〜17:00</td>
            </tr>
            <tr>
              <td>日曜・祝日</td>
              <td>10:00〜16:00</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section id="news" class="news">
        <h2>お知らせ</h2>
        <ul class="news-list">
          <li>春の読書週間がはじまります。期間中は貸出冊数が 2 冊増えます。</li>
          <li>新着本の棚を入口のそばに移しました。</li>
        </ul>
      </section>

      <section id="picks" class="picks">
        <h2>今月のおすすめ本</h2>
        <ol class="picks-list">
          <li>『ひだまり通りの猫たち』</li>
          <li>『雨の日のパン屋さん』</li>
          <li>『星座早見盤のつかいかた』</li>
        </ol>
      </section>
    </main>

    <footer class="site-footer">
      <nav class="footer-nav" aria-label="フッタ">
        <a href="#hours">開館時間</a>
        <a href="access.html">アクセス</a>
      </nav>
      <p class="site-note"><small>ひだまり図書室は架空の施設です。このサイトは Git の研修用の砂場です。</small></p>
    </footer>
  </body>
</html>
